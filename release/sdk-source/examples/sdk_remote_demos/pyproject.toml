[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdip-remote-independent-demos"
version = "0.1.0"
description = "Two independent sample domain-to-DecisionSpec adapters for QDIP Remote SDK"
requires-python = ">=3.11"
dependencies = ["qdip-remote-sdk==0.1.3"]

[tool.setuptools]
py-modules = ["repair_dispatch_plugin", "staffing_plugin"]
