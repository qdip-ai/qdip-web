name: SDK artifact publication (one-time build)

on:
  push:
    branches: ['feat/344-sdk-public-release']
    paths:
      - 'release/sdk-source/**'
      - '.github/workflows/sdk-release-publication.yml'

permissions:
  contents: write

jobs:
  sdk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact source-distribution artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'setuptools>=68' wheel
          python release/sdk-source/scripts/build_sdk_distributable.py
          (
            cd release/sdk-source/packages/client
            npm ci
            npm test
            npm pack --pack-destination ../../dist
          )
          test -s release/sdk-source/dist/qdip-sdk02-bundle-0.1.3.zip
          test -s release/sdk-source/dist/qdip-client-0.2.0.tgz
      - name: Inspect, smoke-test, and seal release files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          import re
          import shutil
          import tarfile
          import zipfile
          root = pathlib.Path('release/sdk-source')
          public = pathlib.Path('public/sdk')
          target = public / 'releases'
          target.mkdir(parents=True, exist_ok=True)
          sha = (root / 'SOURCE_SHA').read_text().strip()
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'invalid pinned source SHA'
          py_name = 'qdip-sdk02-bundle-0.1.3.zip'
          js_name = 'qdip-client-0.2.0.tgz'
          for name in (py_name, js_name):
              shutil.copyfile(root / 'dist' / name, target / name)
          with zipfile.ZipFile(target / py_name) as archive:
              names = archive.namelist()
              assert 'SHA256.json' in names and 'INSTALL.txt' in names
              wheels = [name for name in names if name.startswith('wheels/') and name.endswith('.whl')]
              assert len(wheels) == 3, wheels
              assert any(name.startswith('wheels/qdip_remote_sdk-0.1.3-') for name in wheels)
              assert any(name.startswith('wheels/qdip_remote_independent_demos-0.1.0-') for name in wheels)
              assert any(name.startswith('wheels/websockets-') for name in wheels)
              recorded = json.loads(archive.read('SHA256.json'))
              assert set(recorded) == {pathlib.PurePosixPath(n).name for n in wheels}
              for item in wheels:
                  assert hashlib.sha256(archive.read(item)).hexdigest() == recorded[pathlib.PurePosixPath(item).name]
                  with zipfile.ZipFile(io.BytesIO(archive.read(item))) as wheel:
                      for name in wheel.namelist():
                          assert not name.startswith(('app/', 'scripts/', 'services/', 'deploy/', 'tests/')), name
                          assert '..' not in pathlib.PurePosixPath(name).parts, name
          with tarfile.open(target / js_name, 'r:gz') as archive:
              names = archive.getnames()
              assert 'package/package.json' in names
              assert 'package/dist/index.js' in names
              assert 'package/dist/index.d.ts' in names
              assert names and all(
                  name.startswith(('package/dist/', 'package/README', 'package/package.json'))
                  for name in names
              ), names
              metadata = json.load(archive.extractfile('package/package.json'))
              assert metadata['name'] == '@qdip/client'
              assert metadata['version'] == '0.2.0'
          manifest = {'schema_version': 1, 'source_commit': sha, 'artifacts': {}}
          for key, version, name in [('sdk02', '0.1.3', py_name), ('sdk03', '0.2.0', js_name)]:
              data = (target / name).read_bytes()
              manifest['artifacts'][key] = {
                  'version': version, 'filename': name,
                  'url': 'https://qdip.ai/sdk/releases/' + name,
                  'size_bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()
              }
          (public / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (target / 'SHA256SUMS').write_text(''.join(
              manifest['artifacts'][key]['sha256'] + '  ' + manifest['artifacts'][key]['filename'] + '\n'
              for key in ['sdk02', 'sdk03']
          ))
          print('SOURCE_COMMIT', sha)
          print(json.dumps(manifest, indent=2))
          PY
          unzip -q release/sdk-source/dist/qdip-sdk02-bundle-0.1.3.zip -d /tmp/qdip-sdk02
          python -m venv /tmp/qdip-sdk02-venv
          /tmp/qdip-sdk02-venv/bin/python -m pip install --no-index --find-links /tmp/qdip-sdk02/wheels qdip-remote-sdk==0.1.3 qdip-remote-independent-demos==0.1.0
          /tmp/qdip-sdk02-venv/bin/python - <<'PY'
          import qdip_remote_sdk
          from repair_dispatch_plugin import make_spec
          assert make_spec({'capacity_hours': 4, 'jobs': [{'id':'a','hours':3,'priority':9},{'id':'b','hours':2,'priority':7},{'id':'c','hours':2,'priority':6}]}, 'smoke')
          print('SDK02_INSTALL_AND_HANDLER_PASS')
          PY
          mkdir /tmp/qdip-sdk03-consumer
          (
            cd /tmp/qdip-sdk03-consumer
            npm init -y >/dev/null
            npm install "$GITHUB_WORKSPACE/public/sdk/releases/qdip-client-0.2.0.tgz"
            node --input-type=module -e "import {QdipClient, QdipError} from '@qdip/client'; if(typeof QdipClient!=='function'||typeof QdipError!=='function')process.exit(1);console.log('SDK03_TARBALL_INSTALL_PASS')"
          )
      - name: Commit verified binaries and manifest to release PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -f public/sdk/releases/qdip-sdk02-bundle-0.1.3.zip public/sdk/releases/qdip-client-0.2.0.tgz public/sdk/releases/SHA256SUMS public/sdk/manifest.json
          git diff --cached --quiet && { echo 'No new release files'; exit 1; }
          git commit -m 'build(web #344): attach SHA-256-qualified SDK packages'
          git push origin HEAD:refs/heads/feat/344-sdk-public-release
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-public-release
          path: |
            public/sdk/manifest.json
            public/sdk/releases/qdip-sdk02-bundle-0.1.3.zip
            public/sdk/releases/qdip-client-0.2.0.tgz
            public/sdk/releases/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
