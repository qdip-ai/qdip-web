name: Temporary backend-client formatting
on:
  push:
    branches:
      - feat/portfolio-github-live-20261027
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portfolio-github-live-20261027
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/lib/portfolio-github.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/portfolio-github.ts
          git diff --cached --quiet || git commit -m 'style(portfolio): format Core client'
          git push origin HEAD:feat/portfolio-github-live-20261027
