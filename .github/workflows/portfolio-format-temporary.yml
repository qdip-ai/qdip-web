name: Temporary portfolio formatting
on:
  push:
    branches:
      - feat/portfolio-github-live-20261027
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portfolio-github-live-20261027
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed portfolio implementation
        run: |
          pnpm exec prettier --write \
            'src/app/[locale]/portfolio/page.tsx' \
            src/components/observatory/portfolio-roadmap.tsx \
            src/components/observatory/portfolio-roadmap-data.ts \
            src/components/observatory/portfolio-roadmap-data.vitest.test.ts \
            src/lib/portfolio-github.ts
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/[locale]/portfolio/page.tsx' src/components/observatory/portfolio-roadmap* src/lib/portfolio-github.ts
          git diff --cached --quiet || git commit -m 'style(portfolio): prettier format dynamic issue adapter'
          git push origin HEAD:feat/portfolio-github-live-20261027
