name: Temporary Prettier output for Observatory QA
on:
  push:
    branches: [fix/observatory-sdk-key-checkbox-layout-20261019]
    paths: [.github/workflows/temporary-observatory-format.yml]
permissions:
  contents: read
jobs:
  format-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format standalone UI regression test
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.8 --write --config .prettierrc src/components/observatory/observatory-developer-keys.vitest.test.tsx
          echo '__BEGIN_FORMATTED_TEST__'
          cat src/components/observatory/observatory-developer-keys.vitest.test.tsx
          echo '__END_FORMATTED_TEST__'
