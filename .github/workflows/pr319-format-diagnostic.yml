name: PR319 temporary exact formatter diagnostic
on:
  push:
    branches:
      - fix/observatory-yara-security-publication-403-20261102
  pull_request:
    branches:
      - dev
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect exact formatting delta only
        run: |
          pnpm exec prettier --write src/components/observatory/observatory-plugin-admin.tsx
          git diff -- src/components/observatory/observatory-plugin-admin.tsx
