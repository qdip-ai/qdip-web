name: PR319 exact E2E formatter diagnostic
on:
  pull_request:
    branches:
      - dev
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect exact E2E formatting delta
        run: |
          pnpm exec prettier --write e2e/observatory-plugin-registration.spec.ts
          git diff -- e2e/observatory-plugin-registration.spec.ts
